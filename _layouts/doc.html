---
layout: default
---
<nav class="breadcrumb">
  <a href="{{ '/' | relative_url }}">Subsystems</a> / {{ page.title }}
</nav>

<article class="doc">
  <header class="doc-header">
    <h1>{{ page.title }}</h1>
    {% if page.blurb %}<p class="muted">{{ page.blurb }}</p>{% endif %}
  </header>

  <div class="doc-body">
    {{ content }}
  </div>

  <footer class="doc-footer muted">
    {% if page.updated %}Updated {{ page.updated | date: "%B %-d, %Y" }} · {% endif %}Published {{ site.time | date: "%B %-d, %Y" }}.
  </footer>
</article>
